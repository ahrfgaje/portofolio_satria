<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi GIF</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }
    body {
      overflow-x: hidden;
    }
    .gif-container {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .gif-container img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="gif-container">
    <img src="1.gif" alt="Animasi GIF">
    <img src="2.gif" alt="Animasi GIF 2">
    <img src="3.gif" alt="Animasi GIF 1">
    <img src="4.gif" alt="Animasi GIF 3">
    <img src="5.gif" alt="Animasi GIF 4">
    <img src="6.gif" alt="Animasi GIF 5">
    <img src="7.gif" alt="Animasi GIF 6">
    <img src="8.gif" alt="Animasi GIF 7">
  </div>
</body>
</html>
